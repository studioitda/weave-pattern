<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>STUDIO ITDA · Weave Pattern</title>
<style>
html,body{margin:0;padding:0;background:#f5f3ef;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}
*{box-sizing:border-box}
body{min-height:100vh}
.top{position:relative;z-index:1;background:#fff;border-bottom:1px solid #ddd;padding:12px}
.title{font-size:17px;font-weight:700;margin-bottom:10px}
.row{display:flex;gap:7px;align-items:center;overflow-x:auto;padding:4px 0;white-space:nowrap;-webkit-overflow-scrolling:touch}
.row::-webkit-scrollbar{display:none}
label{font-size:12px}
input[type=number]{width:62px;height:34px;border:1px solid #bbb;border-radius:7px;padding:5px;font-size:14px}
input[type=range]{accent-color:auto}
button{height:34px;border:1px solid #aaa;background:#fff;border-radius:7px;padding:0 11px;font-size:13px;white-space:nowrap}
button.active{background:#222;color:#fff;border-color:#222}
.rgb{display:flex;align-items:center;gap:8px;width:100%;min-width:0}
.rgb label{display:flex;align-items:center;gap:6px;width:100%;font-weight:600}
.rgb input[type=range]{flex:none;width:180px;height:30px;min-width:180px;margin:0;accent-color:auto;background:#999999}
.rgb output{width:30px;text-align:right;font-size:11px;font-weight:400}
.color-tools{justify-content:flex-start}
#preview{width:34px;height:34px;border:1px solid #888;border-radius:7px;flex:none}
#palette{display:flex;gap:8px;min-height:38px}
.color{width:32px;height:32px;padding:0;border-radius:7px;flex:none}
main{padding:12px}
.help{font-size:12px;color:#666;margin-bottom:8px;line-height:1.45}
.gridbox{width:100%;height:min(62vh,560px);overflow:auto;background:#fff;border:1px solid #aaa;border-radius:8px;padding:6px;-webkit-overflow-scrolling:touch;scrollbar-width:auto}
.grid{display:grid;gap:0;width:max-content;touch-action:none;user-select:none;-webkit-user-select:none;transform-origin:top left}
.pan-controls{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}.pan-controls label{display:flex;align-items:center;gap:7px;flex:1;min-width:180px}.pan-controls input[type=range]{flex:1;min-width:0}.cell{border:1px solid #ddd;background:#fff;margin-left:-1px;margin-top:-1px}


.empty{padding:30px;text-align:center;color:#888}
</style>
</head>
<body>
<section class="top">
  <div class="title">STUDIO ITDA · Weave Pattern</div>

  <div class="row">
    <label>가로 <input id="cols" type="number" min="1" max="200" value="80"> 칸</label>
    <label>세로 <input id="rows" type="number" min="1" max="300" value="40"> 칸</label>
    <button id="make">그리드 적용</button>
  </div>

  <div class="row">
    <label>PNG 가로폭 <input id="cm" type="number" min="1" max="200" step="0.1" value="20"> cm</label>
    <span style="font-size:11px;color:#777">저장할 때만 적용</span>
  </div>

  <div class="row">
    <div class="rgb"><label>R <input id="r" type="range" min="0" max="255" value="0"><output id="ro">0</output></label></div>
  </div>

  <div class="row">
    <div class="rgb"><label>G <input id="g" type="range" min="0" max="255" value="0"><output id="go">0</output></label></div>
  </div>

  <div class="row">
    <div class="rgb"><label>B <input id="b" type="range" min="0" max="255" value="0"><output id="bo">0</output></label></div>
  </div>

  <div class="row">
    <div class="rgb color-tools">
      <span id="preview"></span>
      <button id="add">색상 추가</button>
    </div>
  </div>

  <div class="row" id="palette"></div>

  <div class="row">
    <button id="erase">⌫ 지우개</button>
    <button id="clear">전체 지우기</button>
    <button id="save">PNG 저장</button>
  </div>
</section>

<main>
  <div class="help"></div>
  <div class="gridbox" id="gridbox"><div id="grid" class="grid"></div></div>
  <div class="pan-controls">
    <label>좌우 이동 <input id="panX" type="range" min="0" max="0" value="0" step="1"></label>
    <label>상하 이동 <input id="panY" type="range" min="0" max="0" value="0" step="1"></label>
  </div>
</main>

<script>
(function(){
  var cols=80, rows=40, cellSize=14, selected="#000000", eraseMode=false, drawing=false;
  var pinchStartDistance=0, pinchStartCellSize=14, zoomMin=2, zoomMax=60;

  var $=function(id){return document.getElementById(id)};
  var grid=$("grid"), palette=$("palette"), gridbox=$("gridbox"), panX=$("panX"), panY=$("panY");

  function rgb(){
    return "rgb("+$("r").value+","+$("g").value+","+$("b").value+")";
  }
  function updateRGB(){
    $("ro").value=$("r").value;
    $("go").value=$("g").value;
    $("bo").value=$("b").value;
    $("preview").style.background=rgb();
  }
  ["r","g","b"].forEach(function(id){
    $(id).addEventListener("input",updateRGB);
    $(id).addEventListener("change",updateRGB);
  });

  function choose(color, button){
    selected=color;
    eraseMode=false;
    $("erase").classList.remove("active");
    Array.prototype.forEach.call(palette.children,function(x){x.style.outline=""});
    button.style.outline="2px solid #222";
    button.style.outlineOffset="2px";
  }

  function addColorButton(color){
    var b=document.createElement("button");
    b.className="color";
    b.style.background=color;
    b.setAttribute("aria-label",color);
    b.addEventListener("click",function(){choose(color,b)});
    palette.appendChild(b);
    return b;
  }

  ["#000000","#ffffff","#888888"].forEach(function(c,i){
    var b=addColorButton(c);
    if(i===0){b.style.outline="2px solid #222";b.style.outlineOffset="2px"}
  });

  $("add").addEventListener("click",function(){
    var c=rgb();
    var b=addColorButton(c);
    choose(c,b);
  });

  function paint(cell){
    cell.style.backgroundColor=eraseMode ? "#ffffff" : selected;
  }

  function cellFromPoint(x,y){
    var el=document.elementFromPoint(x,y);
    if(el && el.classList && el.classList.contains("cell")) return el;
    return null;
  }

  function touchDistance(a,b){
    var dx=a.clientX-b.clientX, dy=a.clientY-b.clientY;
    return Math.sqrt(dx*dx+dy*dy);
  }

  function updatePanControls(){
    var maxX=Math.max(0,gridbox.scrollWidth-gridbox.clientWidth);
    var maxY=Math.max(0,gridbox.scrollHeight-gridbox.clientHeight);
    panX.max=Math.ceil(maxX);
    panY.max=Math.ceil(maxY);
    panX.value=Math.min(Number(panX.value)||0,maxX);
    panY.value=Math.min(Number(panY.value)||0,maxY);
  }

  panX.addEventListener("input",function(){gridbox.scrollLeft=Number(this.value)||0});
  panY.addEventListener("input",function(){gridbox.scrollTop=Number(this.value)||0});
  gridbox.addEventListener("scroll",function(){
    panX.value=Math.round(gridbox.scrollLeft);
    panY.value=Math.round(gridbox.scrollTop);
  });

  function applyCellSize(nextSize){
    cellSize=Math.max(zoomMin,Math.min(zoomMax,nextSize));
    grid.style.gridTemplateColumns="repeat("+cols+","+cellSize+"px)";
    grid.style.gridAutoRows=cellSize+"px";
    requestAnimationFrame(updatePanControls);
  }

  // One finger paints; two fingers pinch to zoom the grid.
  grid.addEventListener("touchstart",function(e){
    e.preventDefault();
    if(e.touches.length>=2){
      drawing=false;
      pinchStartDistance=touchDistance(e.touches[0],e.touches[1]);
      pinchStartCellSize=cellSize;
      return;
    }
    drawing=true;
    var t=e.touches[0], c=cellFromPoint(t.clientX,t.clientY);
    if(c) paint(c);
  },{passive:false});

  grid.addEventListener("touchmove",function(e){
    e.preventDefault();
    if(e.touches.length>=2){
      drawing=false;
      var distance=touchDistance(e.touches[0],e.touches[1]);
      if(pinchStartDistance>0){
        var nextSize=pinchStartCellSize*(distance/pinchStartDistance);
        applyCellSize(nextSize);
      }
      return;
    }
    if(!drawing)return;
    var t=e.touches[0], c=cellFromPoint(t.clientX,t.clientY);
    if(c) paint(c);
  },{passive:false});

  grid.addEventListener("touchend",function(e){
    e.preventDefault();
    if(e.touches.length<2) pinchStartDistance=0;
    if(e.touches.length===0) drawing=false;
  },{passive:false});

  grid.addEventListener("touchcancel",function(){drawing=false;pinchStartDistance=0},{passive:false});

  // Mouse support for desktop.
  grid.addEventListener("mousedown",function(e){
    drawing=true;
    if(e.target.classList.contains("cell"))paint(e.target);
  });
  grid.addEventListener("mousemove",function(e){
    if(drawing && e.target.classList.contains("cell"))paint(e.target);
  });
  document.addEventListener("mouseup",function(){drawing=false});

  $("erase").addEventListener("click",function(){
    eraseMode=!eraseMode;
    this.classList.toggle("active",eraseMode);
  });

  $("clear").addEventListener("click",function(){
    if(confirm("전체 색상을 지울까요?")){
      Array.prototype.forEach.call(grid.children,function(c){c.style.backgroundColor="#fff"});
    }
  });

  function build(){
    cols=Math.max(1,Math.min(200,parseInt($("cols").value,10)||80));
    rows=Math.max(1,Math.min(300,parseInt($("rows").value,10)||40));
    $("cols").value=cols; $("rows").value=rows;

    grid.innerHTML="";
    grid.style.gridTemplateColumns="repeat("+cols+","+cellSize+"px)";
    grid.style.gridAutoRows=cellSize+"px";

    var frag=document.createDocumentFragment();
    for(var r=0;r<rows;r++){
      for(var c=0;c<cols;c++){
        var d=document.createElement("div");
        d.className="cell";
        d.dataset.r=r; d.dataset.c=c;
        if(c===cols-1)d.classList.add("lastcol");
        if(r===rows-1)d.classList.add("lastrow");
        frag.appendChild(d);
      }
    }
    grid.appendChild(frag);
    requestAnimationFrame(updatePanControls);
  }

  $("make").addEventListener("click",build);

  $("save").addEventListener("click",function(){
    var widthCm=Math.max(1,parseFloat($("cm").value)||20);
    var dpi=300;
    var widthPx=Math.round(widthCm*dpi/2.54);
    var heightPx=Math.max(1,Math.round(widthPx*rows/cols));
    var canvas=document.createElement("canvas");
    canvas.width=widthPx; canvas.height=heightPx;
    var ctx=canvas.getContext("2d");
    if(!ctx){alert("PNG를 만들 수 없는 브라우저야.");return;}

    ctx.fillStyle="#fff";
    ctx.fillRect(0,0,widthPx,heightPx);

    var cw=widthPx/cols, ch=heightPx/rows;
    Array.prototype.forEach.call(grid.children,function(cell){
      ctx.fillStyle=getComputedStyle(cell).backgroundColor || "#fff";
      var x=parseInt(cell.dataset.c,10)*cw;
      var y=parseInt(cell.dataset.r,10)*ch;
      ctx.fillRect(Math.floor(x),Math.floor(y),Math.ceil(cw)+1,Math.ceil(ch)+1);
    });

    // Draw the grid lines explicitly in the PNG, including the outer edges.
    ctx.strokeStyle="#dddddd";
    ctx.lineWidth=Math.max(1,Math.round(dpi/300));
    ctx.beginPath();
    for(var c=0;c<=cols;c++){
      var x=Math.round(c*cw)+0.5;
      ctx.moveTo(x,0); ctx.lineTo(x,heightPx);
    }
    for(var r=0;r<=rows;r++){
      var y=Math.round(r*ch)+0.5;
      ctx.moveTo(0,y); ctx.lineTo(widthPx,y);
    }
    ctx.stroke();

    // Stronger outer border.
    ctx.strokeStyle="#999999";
    ctx.lineWidth=2;
    ctx.strokeRect(0,0,widthPx,heightPx);

    var filename="weave-pattern-"+widthCm+"cm-"+cols+"x"+rows+".png";
    var dataUrl=canvas.toDataURL("image/png");

    // Reliable mobile fallback: show the actual PNG in an in-page viewer.
    // Long-press saves it; Share sends the PNG when supported.
    var old=document.getElementById("pngPreview");
    if(old) old.remove();

    var modal=document.createElement("div");
    modal.id="pngPreview";
    modal.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:9999;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;";

    var img=document.createElement("img");
    img.src=dataUrl; img.alt="weaving pattern PNG";
    img.style.cssText="max-width:100%;max-height:72vh;width:auto;height:auto;background:#fff;object-fit:contain;";

    var note=document.createElement("div");
    note.textContent="이미지를 길게 눌러 저장할 수 있어.";
    note.style.cssText="color:#fff;font-size:13px;text-align:center;";

    var buttons=document.createElement("div");
    buttons.style.cssText="display:flex;gap:8px;justify-content:center;";

    var share=document.createElement("button");
    share.type="button"; share.textContent="이미지 공유";
    share.style.cssText="height:38px;background:#fff;border:1px solid #aaa;border-radius:8px;padding:0 13px;font-size:13px;";
    share.onclick=function(){
      if(!navigator.share){alert("공유 기능이 지원되지 않아. 이미지를 길게 눌러 저장해줘.");return;}
      fetch(dataUrl).then(function(r){return r.blob()}).then(function(blob){
        var file=new File([blob],filename,{type:"image/png"});
        if(navigator.canShare && navigator.canShare({files:[file]}))
          return navigator.share({files:[file],title:"Weaving Pattern"});
        return navigator.share({title:"Weaving Pattern"});
      }).catch(function(){});
    };

    var close=document.createElement("button");
    close.type="button"; close.textContent="닫기";
    close.style.cssText="height:38px;background:#fff;border:1px solid #aaa;border-radius:8px;padding:0 13px;font-size:13px;";
    close.onclick=function(){modal.remove();};

    buttons.appendChild(share); buttons.appendChild(close);
    modal.appendChild(img); modal.appendChild(note); modal.appendChild(buttons);
    document.body.appendChild(modal);
  });

  updateRGB();
  build();
})();
</script>
</body>
</html>

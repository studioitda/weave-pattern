<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>STUDIO ITDA · Weave Pattern</title>
<style>
html,body{margin:0;padding:0;background:#f5f3ef;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}
*{box-sizing:border-box}
body{min-height:100vh}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #ddd;padding:12px}
.title{font-size:17px;font-weight:700;margin-bottom:10px}
.row{display:flex;gap:7px;align-items:center;overflow-x:auto;padding:4px 0;white-space:nowrap;-webkit-overflow-scrolling:touch}
.row::-webkit-scrollbar{display:none}
label{font-size:12px}
input[type=number]{width:62px;height:34px;border:1px solid #bbb;border-radius:7px;padding:5px;font-size:14px}
input[type=range]{accent-color:auto}
button{height:34px;border:1px solid #aaa;background:#fff;border-radius:7px;padding:0 11px;font-size:13px;white-space:nowrap}
button.active{background:#222;color:#fff;border-color:#222}
.rgb{display:flex;align-items:center;gap:5px;min-width:max-content}
.rgb label{display:flex;align-items:center;gap:2px}
.rgb input[type=range]{width:82px;height:30px;margin:0;accent-color:auto;background:#999999}
.rgb output{width:25px;text-align:right;font-size:11px}
#preview{width:34px;height:34px;border:1px solid #888;border-radius:7px;flex:none}
#palette{display:flex;gap:8px;min-height:38px}
.color{width:32px;height:32px;padding:0;border-radius:7px;flex:none}
main{padding:12px}
.help{font-size:12px;color:#666;margin-bottom:8px;line-height:1.45}
.gridbox{width:100%;overflow-x:auto;overflow-y:hidden;background:#fff;border:1px solid #aaa;border-radius:8px;padding:6px;-webkit-overflow-scrolling:touch}
.grid{display:grid;gap:0;width:max-content;touch-action:none;user-select:none;-webkit-user-select:none}
.cell{border-right:1px solid #ddd;border-bottom:1px solid #ddd;background:#fff}
.cell.lastcol{border-right-color:#999}
.cell.lastrow{border-bottom-color:#999}
.empty{padding:30px;text-align:center;color:#888}
</style>
</head>
<body>
<section class="top">
  <div class="title">STUDIO ITDA · Weave Pattern</div>

  <div class="row">
    <label>가로 <input id="cols" type="number" min="1" max="200" value="80"> 칸</label>
    <label>세로 <input id="rows" type="number" min="1" max="300" value="40"> 칸</label>
    <button id="make">그리드 적용</button>
  </div>

  <div class="row">
    <label>PNG 가로폭 <input id="cm" type="number" min="1" max="200" step="0.1" value="20"> cm</label>
    <span style="font-size:11px;color:#777">저장할 때만 적용</span>
  </div>

  <div class="row">
    <div class="rgb">
      <label>R <input id="r" type="range" min="0" max="255" value="0"><output id="ro">0</output></label>
      <label>G <input id="g" type="range" min="0" max="255" value="0"><output id="go">0</output></label>
      <label>B <input id="b" type="range" min="0" max="255" value="0"><output id="bo">0</output></label>
      <span id="preview"></span>
      <button id="add">색상 추가</button>
    </div>
  </div>

  <div class="row" id="palette"></div>

  <div class="row">
    <button id="erase">⌫ 지우개</button>
    <button id="clear">전체 지우기</button>
    <button id="save">PNG 저장</button>
  </div>
</section>

<main>
  <div class="help">색상을 선택한 뒤 칸을 터치하거나 손가락으로 드래그해 색칠해. 지우개를 누르면 지울 수 있어.</div>
  <div class="gridbox"><div id="grid" class="grid"></div></div>
</main>

<script>
(function(){
  var cols=80, rows=40, cellSize=14, selected="#000000", eraseMode=false, drawing=false;

  var $=function(id){return document.getElementById(id)};
  var grid=$("grid"), palette=$("palette");

  function rgb(){
    return "rgb("+$("r").value+","+$("g").value+","+$("b").value+")";
  }
  function updateRGB(){
    $("ro").value=$("r").value;
    $("go").value=$("g").value;
    $("bo").value=$("b").value;
    $("preview").style.background=rgb();
  }
  ["r","g","b"].forEach(function(id){
    $(id).addEventListener("input",updateRGB);
    $(id).addEventListener("change",updateRGB);
  });

  function choose(color, button){
    selected=color;
    eraseMode=false;
    $("erase").classList.remove("active");
    Array.prototype.forEach.call(palette.children,function(x){x.style.outline=""});
    button.style.outline="2px solid #222";
    button.style.outlineOffset="2px";
  }

  function addColorButton(color){
    var b=document.createElement("button");
    b.className="color";
    b.style.background=color;
    b.setAttribute("aria-label",color);
    b.addEventListener("click",function(){choose(color,b)});
    palette.appendChild(b);
    return b;
  }

  ["#000000","#ffffff","#888888"].forEach(function(c,i){
    var b=addColorButton(c);
    if(i===0){b.style.outline="2px solid #222";b.style.outlineOffset="2px"}
  });

  $("add").addEventListener("click",function(){
    var c=rgb();
    var b=addColorButton(c);
    choose(c,b);
  });

  function paint(cell){
    cell.style.backgroundColor=eraseMode ? "#ffffff" : selected;
  }

  function cellFromPoint(x,y){
    var el=document.elementFromPoint(x,y);
    if(el && el.classList && el.classList.contains("cell")) return el;
    return null;
  }

  // Touch is handled on the grid itself, not individually on every cell.
  grid.addEventListener("touchstart",function(e){
    e.preventDefault();
    drawing=true;
    var t=e.touches[0], c=cellFromPoint(t.clientX,t.clientY);
    if(c) paint(c);
  },{passive:false});

  grid.addEventListener("touchmove",function(e){
    e.preventDefault();
    if(!drawing)return;
    var t=e.touches[0], c=cellFromPoint(t.clientX,t.clientY);
    if(c) paint(c);
  },{passive:false});

  grid.addEventListener("touchend",function(e){
    e.preventDefault();
    drawing=false;
  },{passive:false});

  grid.addEventListener("touchcancel",function(){drawing=false},{passive:false});

  // Mouse support for desktop.
  grid.addEventListener("mousedown",function(e){
    drawing=true;
    if(e.target.classList.contains("cell"))paint(e.target);
  });
  grid.addEventListener("mousemove",function(e){
    if(drawing && e.target.classList.contains("cell"))paint(e.target);
  });
  document.addEventListener("mouseup",function(){drawing=false});

  $("erase").addEventListener("click",function(){
    eraseMode=!eraseMode;
    this.classList.toggle("active",eraseMode);
  });

  $("clear").addEventListener("click",function(){
    if(confirm("전체 색상을 지울까요?")){
      Array.prototype.forEach.call(grid.children,function(c){c.style.backgroundColor="#fff"});
    }
  });

  function build(){
    cols=Math.max(1,Math.min(200,parseInt($("cols").value,10)||80));
    rows=Math.max(1,Math.min(300,parseInt($("rows").value,10)||40));
    $("cols").value=cols; $("rows").value=rows;

    grid.innerHTML="";
    grid.style.gridTemplateColumns="repeat("+cols+","+cellSize+"px)";
    grid.style.gridAutoRows=cellSize+"px";

    var frag=document.createDocumentFragment();
    for(var r=0;r<rows;r++){
      for(var c=0;c<cols;c++){
        var d=document.createElement("div");
        d.className="cell";
        d.dataset.r=r; d.dataset.c=c;
        if(c===cols-1)d.classList.add("lastcol");
        if(r===rows-1)d.classList.add("lastrow");
        frag.appendChild(d);
      }
    }
    grid.appendChild(frag);
  }

  $("make").addEventListener("click",build);

  $("save").addEventListener("click",function(){
    var widthCm=Math.max(1,parseFloat($("cm").value)||20);
    var dpi=300, widthPx=Math.round(widthCm*dpi/2.54);
    var heightPx=Math.round(widthPx*rows/cols);
    var canvas=document.createElement("canvas");
    canvas.width=widthPx; canvas.height=heightPx;
    var ctx=canvas.getContext("2d");
    ctx.fillStyle="#fff"; ctx.fillRect(0,0,widthPx,heightPx);

    var cw=widthPx/cols, ch=heightPx/rows;
    Array.prototype.forEach.call(grid.children,function(cell){
      ctx.fillStyle=getComputedStyle(cell).backgroundColor;
      ctx.fillRect(
        parseInt(cell.dataset.c,10)*cw,
        parseInt(cell.dataset.r,10)*ch,
        Math.ceil(cw)+1,
        Math.ceil(ch)+1
      );
    });

    var a=document.createElement("a");
    a.download="weave-pattern-"+widthCm+"cm-"+cols+"x"+rows+".png";
    a.href=canvas.toDataURL("image/png");
    document.body.appendChild(a);
    a.click();
    a.remove();
  });

  updateRGB();
  build();
})();
</script>
</body>
</html>
